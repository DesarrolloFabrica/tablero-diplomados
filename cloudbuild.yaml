# ─────────────────────────────────────────────────────────────────────────────
# Tablero Diplomados · Cloud Build → Artifact Registry → Cloud Run (2 servicios)
#
#   gcloud builds submit --config cloudbuild.yaml --project it-fab-contenido-edu-4
#
# 1. Construye y publica las imágenes de backend y frontend (en paralelo).
# 2. Despliega el backend (FastAPI): sale por el conector VPC y se conecta a core-database.
# 3. Lee la URL del backend y despliega el frontend (nginx) con proxy /api → backend.
#
# Requisito único: secreto diplomados-db-password con la contraseña de la base (ya creado).
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  _REGION: us-central1
  _REPO: diplomados-docker
  _BACKEND_SERVICE: diplomados-backend
  _FRONTEND_SERVICE: diplomados-frontend
  _VPC_CONNECTOR: cr-connector
  _DB_HOST: 136.113.128.135
  _DB_NAME: core
  _DB_USER: user-core
  _DB_SCHEMA: ventas_ec
  _DB_PASSWORD_SECRET: diplomados-db-password
  _SESSION_SECRET: diplomados-session-secret
  # Cliente OAuth web (consola de Google). Pasar en el submit si aquí queda vacío:
  #   --substitutions=_GOOGLE_CLIENT_ID=123.apps.googleusercontent.com
  _GOOGLE_CLIENT_ID: ''
  _AUTH_ALLOWED_DOMAIN: cun.edu.co

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build-backend
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_SERVICE}:${BUILD_ID}', 'backend']
    waitFor: ['-']

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_FRONTEND_SERVICE}:${BUILD_ID}', 'frontend']
    waitFor: ['-']

  - id: push-backend
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_SERVICE}:${BUILD_ID}']
    waitFor: ['build-backend']

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_FRONTEND_SERVICE}:${BUILD_ID}']
    waitFor: ['build-frontend']

  - id: deploy-backend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Igual que los demás backends del proyecto que usan core-database: salida por el
        # conector VPC (IP fija autorizada en la instancia) y conexión por IP pública con SSL.
        ENV_VARS="DB_HOST=${_DB_HOST},DB_PORT=5432,DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},DB_SCHEMA=${_DB_SCHEMA},DB_SSLMODE=require,AUTH_ALLOWED_DOMAIN=${_AUTH_ALLOWED_DOMAIN}"
        if [ -n "${_GOOGLE_CLIENT_ID}" ]; then
          ENV_VARS="$${ENV_VARS},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}"
        fi
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_SERVICE}:${BUILD_ID} \
          --region=${_REGION} \
          --vpc-connector=${_VPC_CONNECTOR} \
          --vpc-egress=all-traffic \
          --set-env-vars="$$ENV_VARS" \
          --set-secrets=DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,SESSION_SECRET=${_SESSION_SECRET}:latest \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --allow-unauthenticated \
          --quiet
    waitFor: ['push-backend']

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        BACKEND_URL=$(gcloud run services describe ${_BACKEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        BACKEND_HOST=$${BACKEND_URL#https://}
        echo "Backend: $${BACKEND_HOST}"
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_FRONTEND_SERVICE}:${BUILD_ID} \
          --region=${_REGION} \
          --set-env-vars=BACKEND_HOST=$${BACKEND_HOST} \
          --memory=256Mi \
          --min-instances=0 \
          --max-instances=3 \
          --allow-unauthenticated \
          --quiet
        echo "Tablero: $(gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} --format='value(status.url)')"
    waitFor: ['deploy-backend', 'push-frontend']

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_BACKEND_SERVICE}:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_FRONTEND_SERVICE}:${BUILD_ID}
